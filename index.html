<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 改成你的名字 -->
  <title>你的名字｜個人網站</title>
  <meta name="description" content="一句話介紹你自己，會顯示在搜尋結果裡。">
  <style>
    :root {
      --bg: #eef2f5;
      --ink: #1f2a33;
      --muted: #5b6b78;
      --accent: #2f6f8f;
      --line: #cbd5dd;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #172027;
        --ink: #e6edf2;
        --muted: #9aaab6;
        --accent: #7fb3cf;
        --line: #33424d;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.8;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 4rem 1.5rem 3rem;
    }
    h1 {
      font-size: clamp(2.4rem, 8vw, 3.6rem);
      line-height: 1.15;
      margin: 0 0 0.75rem;
      letter-spacing: 0.02em;
    }
    .intro {
      font-size: 1.15rem;
      color: var(--muted);
      margin: 0 0 3rem;
    }
    section {
      border-top: 1px solid var(--line);
      padding: 1.75rem 0;
    }
    h2 {
      font-size: 1.1rem;
      margin: 0 0 0.75rem;
    }
    p { margin: 0 0 0.75rem; }
    ul { margin: 0; padding-left: 1.2rem; }
    li { margin-bottom: 0.5rem; }
    a {
      color: var(--accent);
      text-underline-offset: 3px;
    }
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    footer {
      font-size: 0.85rem;
      color: var(--muted);
      padding-top: 2rem;
    }
  </style>
</head>
<body>
  <main>
    <!-- ① 名字和一句話介紹 -->
    <h1>你的名字</h1>
    <p class="intro">住在台北，喜歡做網頁、拍照，偶爾寫點東西。</p>

    <!-- ② 關於我：寫兩三句就好 -->
    <section>
      <h2>關於我</h2>
      <p>在這裡寫你是誰、在做什麼、對什麼有興趣。</p>
    </section>

    <!-- ③ 作品或文章：把 href 換成實際連結，要加就複製一行 <li> -->
    <section>
      <h2>作品</h2>
      <ul>
        <li><a href="#">第一個作品名稱</a>：一句話說明它是什麼。</li>
        <li><a href="#">第二個作品名稱</a>：一句話說明它是什麼。</li>
      </ul>
    </section>

    <!-- ④ 聯絡方式：不需要的就刪掉 -->
    <section>
      <h2>聯絡我</h2>
      <ul>
        <li>Email：<a href="mailto:you@example.com">you@example.com</a></li>
        <li>GitHub：<a href="https://github.com/你的帳號">github.com/你的帳號</a></li>
      </ul>
    </section>

    <footer>© 2026 你的名字</footer>
  </main>
</body>
</html>
