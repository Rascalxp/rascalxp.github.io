name: probe
on:
  push:
    branches: [claude/twse-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_sectors.py
      - run: |
          git config user.name probe; git config user.email probe@example.com
          git rm -rq --cached probe || true
          git add data/; git commit -m probe-result; git push
