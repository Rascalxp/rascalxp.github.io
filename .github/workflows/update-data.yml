name: 更新籌碼與新聞

on:
  schedule:
    # GitHub 的排程用 UTC 時間（台灣時間 = UTC+8）。排程常會延遲，偶爾還會被跳過，
    # 所以收盤後多排幾次；資料沒變就不會存檔。分鐘刻意避開整點，比較不會塞車。
    - cron: "13 7 * * 1-5"   # 台灣 15:13：證交所、期交所約 15:00 公布
    - cron: "37 7 * * 1-5"   # 台灣 15:37
    - cron: "7 8 * * 1-5"    # 台灣 16:07
    - cron: "27 8 * * 1-5"   # 台灣 16:27：保證 16:30 前再抓一次
    - cron: "7 23 * * *"     # 台灣 07:07：早盤前新聞
    - cron: "7 4 * * *"      # 台灣 12:07：午間新聞
    - cron: "7 12 * * *"     # 台灣 20:07：晚間新聞
  workflow_dispatch: {}      # 可在 Actions 頁面手動執行

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: 籌碼（三大法人、散戶微台）
        continue-on-error: true
        run: python scripts/fetch_chips.py

      - name: 財經節目（YouTube、Podcast）
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch_media.py

      - name: AI 新聞與摘要
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python scripts/fetch_news.py

      - name: 有變動就存檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "資料沒有變動"
            exit 0
          fi
          git commit -m "自動更新資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          # 管理者可能剛好在後台發文，先同步再推
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
