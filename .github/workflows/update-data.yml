name: 更新籌碼與新聞

on:
  schedule:
    # GitHub 的排程用 UTC 時間（台灣時間 = UTC+8），實際執行常會延遲 5～30 分鐘
    - cron: "40 7 * * 1-5"   # 台灣 15:40：三大法人、期貨籌碼公布後
    - cron: "30 9 * * 1-5"   # 台灣 17:30：補抓一次，避免 15:40 時資料還沒出來
    - cron: "0 23 * * *"     # 台灣 07:00：早盤前新聞
    - cron: "0 4 * * *"      # 台灣 12:00：午間新聞
    - cron: "0 12 * * *"     # 台灣 20:00：晚間新聞
  workflow_dispatch: {}      # 可在 Actions 頁面手動執行

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: 籌碼（三大法人、散戶微台）
        continue-on-error: true
        run: python scripts/fetch_chips.py

      - name: 財經節目（YouTube、Podcast）
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/yt_debug.py

      - name: AI 新聞與摘要
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python scripts/fetch_news.py

      - name: 有變動就存檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "資料沒有變動"
            exit 0
          fi
          git commit -m "自動更新資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          # 管理者可能剛好在後台發文，先同步再推
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
